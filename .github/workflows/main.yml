name: Main
on: workflow_dispatch

# permissions: write-all

jobs:
  Build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android x64
            os: ubuntu-22.04
            buildArgs: "android -D android64 -clean"
            artifactName: Android x64
            expectedAbi: arm64-v8a
            artifactPath: "export/release/android/bin/app/build/outputs/apk/release/*.apk"
          - name: Android x32
            os: ubuntu-22.04
            buildArgs: "android -D android32 -clean"
            artifactName: Android x32
            expectedAbi: armeabi-v7a
            artifactPath: "export/release/android/bin/app/build/outputs/apk/release/*.apk"
          - name: iOS
            os: macos-15
            buildArgs: "ios -nosign"
            artifactName: IOS
            artifactPath: "export/release/ios/build/Release-iphoneos/*.ipa"
    uses: ./.github/workflows/build.yml
    with:
        name: ${{ matrix.name }}
        os: ${{ matrix.os }}
        buildArgs: ${{ matrix.buildArgs }}
        artifactName: ${{ matrix.artifactName }}
        artifactPath: ${{ matrix.artifactPath }}
        expectedAbi: ${{ matrix.expectedAbi }}
